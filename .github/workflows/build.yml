# Builds Stalemate installers on GitHub's macOS, Windows and Linux machines.
#
# - Run it by hand (Actions tab → "Build installers" → Run workflow): the
#   installers are attached to the run as downloadable artifacts.
# - Push a version tag (git tag v0.1.0 && git push --tags): the installers are
#   also attached to a draft GitHub Release you can review and publish.

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            runner: windows-latest
            args: ""
            bundles: src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            runner: ubuntu-22.04
            args: ""
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only tag pushes create a (draft) release; manual runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Stalemate {0}', github.ref_name) || '' }}
          releaseDraft: true

      # Tidy the release downloads: give each installer a name that says which
      # OS it's for, and drop the .app.tar.gz tauri-action always attaches for
      # Mac (meant for auto-updaters, which Stalemate doesn't use).
      - name: Rename release downloads
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release/assets" --jq '.[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              *.app.tar.gz) gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; continue ;;
              *-setup.exe)  new="Stalemate-$v-Windows-Setup.exe" ;;
              *.dmg)        new="Stalemate-$v-macOS.dmg" ;;
              *.AppImage)   new="Stalemate-$v-Linux.AppImage" ;;
              *.deb)        new="Stalemate-$v-Linux-Debian-Ubuntu.deb" ;;
              *.rpm)        new="Stalemate-$v-Linux-Fedora.rpm" ;;
              *) continue ;;
            esac
            [ "$name" = "$new" ] || gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --silent
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stalemate-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
